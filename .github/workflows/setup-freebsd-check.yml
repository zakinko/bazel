# 2017 年の buildkite/setup-freebsd.sh を直したものが、きれいな FreeBSD で
# 本当に bootstrap を通すかを見る。upstream の CI に FreeBSD の platform は
# 一つも無く、この script はどこからも呼ばれていない。
name: setup-freebsd check

on:
  push:
    paths:
      - 'ci/setup-freebsd.sh'
      - '.github/workflows/setup-freebsd-check.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freebsd:
    name: FreeBSD amd64
    runs-on: ubuntu-latest
    steps:
      - name: Make room on the runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1
        with:
          usesh: true
          mem: 8192
          copyback: false
          run: |
            # 直した setup script だけを使う。ここで足りなければ落ちる。
            sh ci/setup-freebsd.sh
            . /etc/profile
            echo "JAVA_HOME=$JAVA_HOME"
            command -v bash unzip python3 gmake
            cd /root
            fetch -o dist.zip https://github.com/bazelbuild/bazel/releases/download/9.2.0/bazel-9.2.0-dist.zip
            mkdir -p b && cd b && unzip -q -o ../dist.zip
            patch -p1 < "$GITHUB_WORKSPACE/ci/bazel-script-fix.patch"
            mkdir -p toolchain_local && cp "$GITHUB_WORKSPACE/ci/rules_cc_lm.patch" toolchain_local/
            : > toolchain_local/BUILD
            cat >> MODULE.bazel <<'M'

            single_version_override(
                module_name = "rules_cc",
                patch_strip = 1,
                patches = ["//toolchain_local:rules_cc_lm.patch"],
            )
            M
            export EXTRA_BAZEL_ARGS="--tool_java_runtime_version=local_jdk --java_language_version=21 --tool_java_language_version=21 --jobs=2"
            bash ./compile.sh
            ./output/bazel --version
