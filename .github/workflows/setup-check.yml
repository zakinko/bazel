# buildkite/setup-<os>.sh に出せる形の script を、きれいな機械で走らせて
# 確かめる。script だけで機械を仕度し、そのあと素の 9.2.0 を建てる。
# master には dist archive が無く、compile.sh は PROTOC と
# GRPC_JAVA_PLUGIN を要るので、踏み台なしで建てられるのは release だけ。
name: setup check

on:
  push:
    paths:
      - 'ci/setup-*.sh'
      - '.github/workflows/setup-check.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openbsd:
    name: OpenBSD
    runs-on: ubuntu-latest
    steps:
      - name: Make room on the runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: vmactions/openbsd-vm@86cdc08415d9d0865267e686561e276c52d62530 # v1
        with:
          usesh: true
          mem: 8192
          copyback: false
          run: |
            sh ci/setup-openbsd.sh
            . /etc/profile
            ulimit -n 4096
            for t in bash unzip zip python3 gmake javac git; do
              p=$(command -v $t) || { echo "$t が無い"; exit 1; }
              printf '%-8s %s\n' "$t" "$p"
            done
            # 素の 9.2.0 はどの BSD でも建たない。NetBSD は bazel が action の
            # shell に /bin/bash をべた書きしていて (OS の列挙に NETBSD が無く
            # OS.UNKNOWN に落ちる) Cannot run program と言い、OpenBSD は
            # generate_jvm_module_options.sh の shebang が /bin/bash で
            # bad interpreter と言い、DragonFly は rules_go の
            # go/toolchain:dragonflybsd が無い。どれも機械の仕度の問題では
            # ないので、対応の入った枝を持ってきて建て、setup script が
            # 仕度した機械でそれが通ることを見る。
            cd /root && rm -rf src && git clone -q --depth 1 \
              -b netbsd-ci https://github.com/zakinko/bazel.git src
            SRCDIR=/root/src sh /root/src/ci/bsd-bootstrap.sh

  netbsd:
    name: NetBSD
    runs-on: ubuntu-latest
    steps:
      - name: Make room on the runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: vmactions/netbsd-vm@6334c835de4c04a59fe59f0f8f071e02a2f0bab3 # v1
        with:
          release: "11.0"
          usesh: true
          mem: 8192
          copyback: false
          run: |
            sh ci/setup-netbsd.sh
            . /etc/profile
            for t in bash unzip zip python3 gmake javac git; do
              p=$(command -v $t) || { echo "$t が無い"; exit 1; }
              printf '%-8s %s\n' "$t" "$p"
            done
            # 素の 9.2.0 はどの BSD でも建たない。NetBSD は bazel が action の
            # shell に /bin/bash をべた書きしていて (OS の列挙に NETBSD が無く
            # OS.UNKNOWN に落ちる) Cannot run program と言い、OpenBSD は
            # generate_jvm_module_options.sh の shebang が /bin/bash で
            # bad interpreter と言い、DragonFly は rules_go の
            # go/toolchain:dragonflybsd が無い。どれも機械の仕度の問題では
            # ないので、対応の入った枝を持ってきて建て、setup script が
            # 仕度した機械でそれが通ることを見る。
            cd /root && rm -rf src && git clone -q --depth 1 \
              -b netbsd-ci https://github.com/zakinko/bazel.git src
            SRCDIR=/root/src sh /root/src/ci/bsd-bootstrap.sh

  dragonfly:
    name: DragonFly BSD
    runs-on: ubuntu-latest
    steps:
      - name: Make room on the runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: vmactions/dragonflybsd-vm@7cd7c9b7f2b06e8e03d2337a9476995f3c112acf # v1
        with:
          usesh: true
          mem: 8192
          copyback: false
          run: |
            sh ci/setup-dragonflybsd.sh
            . /etc/profile
            for t in bash unzip zip python3 gmake javac git; do
              p=$(command -v $t) || { echo "$t が無い"; exit 1; }
              printf '%-8s %s\n' "$t" "$p"
            done
            echo "CC=$CC CXX=$CXX"
            # 素の 9.2.0 はどの BSD でも建たない。DragonFly は rules_go の
            # go/toolchain:dragonflybsd が無い。機械の仕度の問題ではないので、
            # 対応の入った枝を持ってきて建て、setup script が仕度した機械で
            # それが通ることを見る。
            cd /root && rm -rf src && git clone -q --depth 1 \
              -b netbsd-ci https://github.com/zakinko/bazel.git src
            SRCDIR=/root/src sh /root/src/ci/bsd-bootstrap.sh
