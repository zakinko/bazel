# bazel の master が BSD で建つかを測る。9.2.0 ではなく master を見る。
#
# master は git の木なので compile.sh が使えない。踏み台の bazel が要る。
# FreeBSD と GhostBSD には package の bazel9 が在るのでそれを使い、
# NetBSD OpenBSD DragonFly には無いので、まず 9.2.0 を dist archive から
# すっぴんで建てて、その output/bazel を踏み台にする。
name: master on BSD

on:
  push:
    paths:
      - '.github/workflows/master-bsd.yml'
      - 'ci/master-build.sh'
      - 'ci/bsd-bootstrap.sh'
      - 'ci/rules_cc_859.patch'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freebsd:
    name: FreeBSD (master)
    runs-on: ubuntu-latest
    steps:
      - name: Make room on the runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1
        with:
          usesh: true
          mem: 8192
          copyback: false
          prepare: |
            mount -t procfs proc /proc || true
            pkg install -y bazel9 openjdk25 python3 zip unzip bash git wget gmake
          run: |
            export JAVA_HOME=/usr/local/openjdk25
            export PATH=$JAVA_HOME/bin:/usr/local/bin:$PATH
            export JAVA_VER=25
            export PATCH859="$GITHUB_WORKSPACE/ci/rules_cc_859.patch"
            export B=$(command -v bazel9 || command -v bazel)
            sh "$GITHUB_WORKSPACE/ci/master-build.sh"

  ghostbsd:
    name: GhostBSD (master)
    runs-on: ubuntu-latest
    steps:
      - name: Make room on the runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: vmactions/ghostbsd-vm@4695f191a42fd12ec60a375adde35275c01d6b8e # v1.0.3
        with:
          usesh: true
          mem: 8192
          copyback: false
          prepare: |
            mount -t procfs proc /proc || true
            pkg install -y bazel9 openjdk25 python3 zip unzip bash git wget gmake
          run: |
            export JAVA_HOME=/usr/local/openjdk25
            export PATH=$JAVA_HOME/bin:/usr/local/bin:$PATH
            export JAVA_VER=25
            export PATCH859="$GITHUB_WORKSPACE/ci/rules_cc_859.patch"
            export B=$(command -v bazel9 || command -v bazel)
            sh "$GITHUB_WORKSPACE/ci/master-build.sh"

  netbsd:
    name: NetBSD (master)
    runs-on: ubuntu-latest
    steps:
      - name: Make room on the runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: vmactions/netbsd-vm@6334c835de4c04a59fe59f0f8f071e02a2f0bab3 # v1
        with:
          release: "11.0"
          usesh: true
          mem: 8192
          copyback: false
          prepare: |
            set -e
            SET=$(uname -m)
            ftp -o /tmp/xbase.tar.xz "https://cdn.NetBSD.org/pub/NetBSD/NetBSD-11.0/$SET/binary/sets/xbase.tar.xz"
            tar -C / -xf /tmp/xbase.tar.xz
            /usr/sbin/pkg_add -U pkgin
            pkgin -y install openjdk21 bash zip unzip python313 git curl gmake
          run: |
            export JAVA_HOME=/usr/pkg/java/openjdk21
            export PATH=$JAVA_HOME/bin:/usr/pkg/bin:$PATH
            export JAVA_VER=21
            export PATCH859="$GITHUB_WORKSPACE/ci/rules_cc_859.patch"
            # 踏み台の bazel が package から手に入らない。素の 9.2.0 も
            # ここでは建たない (NetBSD は action の shell の /bin/bash、
            # OpenBSD は generate_jvm_module_options.sh の shebang、
            # DragonFly は rules_go の go/toolchain:dragonflybsd)。BSD 対応の
            # 入った枝から 9.2.0 を建てて踏み台にする。踏み台は測るものでは
            # なく道具なので、当て物の入ったもので構わない。
            cd /root && rm -rf boot && git clone -q --depth 1 \
              -b netbsd-ci https://github.com/zakinko/bazel.git boot
            SRCDIR=/root/boot sh /root/boot/ci/bsd-bootstrap.sh
            export B=$(cat /tmp/bootstrap-bazel-path)
            sh "$GITHUB_WORKSPACE/ci/master-build.sh"

  openbsd:
    name: OpenBSD (master)
    runs-on: ubuntu-latest
    steps:
      - name: Make room on the runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: vmactions/openbsd-vm@86cdc08415d9d0865267e686561e276c52d62530 # v1
        with:
          usesh: true
          mem: 8192
          copyback: false
          prepare: |
            pkg_add -I jdk%21 bash zip unzip-- python%3 git curl gmake
          run: |
            export JAVA_HOME=/usr/local/jdk-21
            export PATH=$JAVA_HOME/bin:/usr/local/bin:$PATH
            export JAVA_VER=21
            export PATCH859="$GITHUB_WORKSPACE/ci/rules_cc_859.patch"
            # 踏み台の bazel が package から手に入らない。素の 9.2.0 も
            # ここでは建たない (NetBSD は action の shell の /bin/bash、
            # OpenBSD は generate_jvm_module_options.sh の shebang、
            # DragonFly は rules_go の go/toolchain:dragonflybsd)。BSD 対応の
            # 入った枝から 9.2.0 を建てて踏み台にする。踏み台は測るものでは
            # なく道具なので、当て物の入ったもので構わない。
            cd /root && rm -rf boot && git clone -q --depth 1 \
              -b netbsd-ci https://github.com/zakinko/bazel.git boot
            SRCDIR=/root/boot sh /root/boot/ci/bsd-bootstrap.sh
            export B=$(cat /tmp/bootstrap-bazel-path)
            sh "$GITHUB_WORKSPACE/ci/master-build.sh"

  dragonfly:
    name: DragonFly (master)
    runs-on: ubuntu-latest
    steps:
      - name: Make room on the runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: vmactions/dragonflybsd-vm@7cd7c9b7f2b06e8e03d2337a9476995f3c112acf # v1
        with:
          usesh: true
          mem: 8192
          copyback: false
          prepare: |
            mount -t procfs proc /proc || true
            pkg install -y openjdk21 python3 zip unzip bash git wget gmake llvm
          run: |
            export JAVA_HOME=/usr/local/openjdk21
            export PATH=$JAVA_HOME/bin:/usr/local/bin:$PATH
            export JAVA_VER=21
            export PATCH859="$GITHUB_WORKSPACE/ci/rules_cc_859.patch"
            # 踏み台の bazel が package から手に入らない。素の 9.2.0 も
            # ここでは建たない (NetBSD は action の shell の /bin/bash、
            # OpenBSD は generate_jvm_module_options.sh の shebang、
            # DragonFly は rules_go の go/toolchain:dragonflybsd)。BSD 対応の
            # 入った枝から 9.2.0 を建てて踏み台にする。踏み台は測るものでは
            # なく道具なので、当て物の入ったもので構わない。
            cd /root && rm -rf boot && git clone -q --depth 1 \
              -b netbsd-ci https://github.com/zakinko/bazel.git boot
            SRCDIR=/root/boot sh /root/boot/ci/bsd-bootstrap.sh
            export B=$(cat /tmp/bootstrap-bazel-path)
            sh "$GITHUB_WORKSPACE/ci/master-build.sh"
