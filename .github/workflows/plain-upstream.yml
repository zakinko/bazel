# 素の upstream bazel 9.2.0 が FreeBSD と OpenBSD で建つかを測る。
# 建つなら、その BSD へ出すものは無い。建たないなら在る。
name: plain upstream

on:
  push:
    paths:
      - '.github/workflows/plain-upstream.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freebsd:
    name: FreeBSD amd64 (plain)
    runs-on: ubuntu-latest
    steps:
      - name: Make room on the runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1
        with:
          usesh: true
          mem: 8192
          copyback: false
          prepare: |
            mount -t procfs proc /proc || true
            pkg install -y openjdk21 python3 zip unzip bash git wget gmake
          run: |
            export JAVA_HOME=/usr/local/openjdk21
            export PATH=$JAVA_HOME/bin:/usr/local/bin:$PATH
            export PLAIN=1
            export EXTRA_BAZEL_ARGS="--tool_java_runtime_version=local_jdk --java_language_version=21 --tool_java_language_version=21 --jobs=2"
            sh ci/bsd-bootstrap.sh

  openbsd:
    name: OpenBSD amd64 (plain)
    runs-on: ubuntu-latest
    steps:
      - name: Make room on the runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: vmactions/openbsd-vm@86cdc08415d9d0865267e686561e276c52d62530 # v1
        with:
          usesh: true
          mem: 8192
          copyback: false
          prepare: |
            pkg_add -I jdk%21 bash zip unzip-- python%3 git wget gmake
          run: |
            export JAVA_HOME=/usr/local/jdk-21
            export PATH=$JAVA_HOME/bin:/usr/local/bin:$PATH
            export PLAIN=1
            export EXTRA_BAZEL_ARGS="--tool_java_runtime_version=local_jdk --java_language_version=21 --tool_java_language_version=21 --jobs=2"
            sh ci/bsd-bootstrap.sh
